<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d1a"/><stop offset="1" stop-color="#141033"/>
    </linearGradient>
    <linearGradient id="llmNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d6e"/><stop offset="1" stop-color="#25124a"/>
    </linearGradient>
    <linearGradient id="ruleNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14306b"/><stop offset="1" stop-color="#0c1f4a"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4b5fd"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="660" rx="28" fill="url(#bg)"/>

  <!-- title -->
  <text x="48" y="64" fill="#f8fafc" font-size="28" font-weight="700">How priors thinks</text>
  <text x="48" y="94" fill="#94a3b8" font-size="15">Every request bounces between judgment and guardrails. Nothing reaches you without passing the rules.</text>
  <circle cx="1010" cy="70" r="7" fill="#a78bfa"/><text x="1024" y="75" fill="#ddd6fe" font-size="14">LLM · judgment</text>
  <circle cx="1140" cy="70" r="7" fill="#60a5fa"/><text x="1154" y="75" fill="#bfdbfe" font-size="14">Rules · code</text>

  <!-- lanes -->
  <rect x="190" y="125" width="900" height="175" rx="18" fill="#7c3aed" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.35"/>
  <text x="210" y="150" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="2">LLM · WHERE JUDGMENT IS NEEDED</text>
  <rect x="190" y="330" width="900" height="175" rx="18" fill="#2563eb" fill-opacity="0.10" stroke="#3b82f6" stroke-opacity="0.35"/>
  <text x="210" y="355" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="2">RULES · WHERE PREDICTABILITY MATTERS</text>

  <!-- flow arrows (drawn first, under nodes) -->
  <g fill="none" stroke="url(#flow)" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M172,315 C188,315 190,215 203,215"/>
    <path d="M270,262 C270,320 400,320 400,378"/>
    <path d="M436,378 C436,320 564,320 564,262"/>
    <path d="M630,215 L644,215"/>
    <path d="M777,215 L791,215"/>
    <path d="M858,262 C858,320 1005,320 1005,378"/>
    <path d="M1071,425 C1090,425 1092,315 1108,315"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowGrey)">
    <path d="M417,530 L417,472"/>
    <path d="M1005,472 L1005,530"/>
  </g>

  <!-- input / output -->
  <rect x="40" y="280" width="132" height="70" rx="35" fill="#1e293b" stroke="#475569"/>
  <text x="106" y="310" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">Your situation,</text>
  <text x="106" y="329" fill="#cbd5e1" font-size="13" text-anchor="middle">question or PRD</text>

  <rect x="1108" y="280" width="140" height="70" rx="35" fill="#1e293b" stroke="#a78bfa" filter="url(#glow)"/>
  <text x="1178" y="310" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">Cited answer,</text>
  <text x="1178" y="329" fill="#cbd5e1" font-size="13" text-anchor="middle">pushback, findings</text>

  <!-- LLM nodes -->
  <g>
    <rect x="205" y="170" width="130" height="92" rx="14" fill="url(#llmNode)" stroke="#a78bfa"/>
    <circle cx="225" cy="190" r="11" fill="#a78bfa"/><text x="225" y="195" fill="#1e1b4b" font-size="12" font-weight="800" text-anchor="middle">1</text>
    <text x="243" y="195" fill="#f5f3ff" font-size="15" font-weight="700">Understand</text>
    <text x="270" y="224" fill="#c4b5fd" font-size="12" text-anchor="middle">messy description</text>
    <text x="270" y="241" fill="#c4b5fd" font-size="12" text-anchor="middle">→ problem shape</text>
  </g>
  <g>
    <rect x="499" y="170" width="130" height="92" rx="14" fill="url(#llmNode)" stroke="#a78bfa"/>
    <circle cx="519" cy="190" r="11" fill="#a78bfa"/><text x="519" y="195" fill="#1e1b4b" font-size="12" font-weight="800" text-anchor="middle">3</text>
    <text x="537" y="195" fill="#f5f3ff" font-size="15" font-weight="700">Compare</text>
    <text x="564" y="224" fill="#c4b5fd" font-size="12" text-anchor="middle">is it really</text>
    <text x="564" y="241" fill="#c4b5fd" font-size="12" text-anchor="middle">comparable?</text>
  </g>
  <g>
    <rect x="646" y="170" width="130" height="92" rx="14" fill="url(#llmNode)" stroke="#a78bfa"/>
    <circle cx="666" cy="190" r="11" fill="#a78bfa"/><text x="666" y="195" fill="#1e1b4b" font-size="12" font-weight="800" text-anchor="middle">4</text>
    <text x="684" y="195" fill="#f5f3ff" font-size="15" font-weight="700">Spar</text>
    <text x="711" y="224" fill="#c4b5fd" font-size="12" text-anchor="middle">synthesize, push</text>
    <text x="711" y="241" fill="#c4b5fd" font-size="12" text-anchor="middle">back, audit a PRD</text>
  </g>
  <g>
    <rect x="793" y="170" width="130" height="92" rx="14" fill="url(#llmNode)" stroke="#f0abfc" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="813" cy="190" r="11" fill="#f0abfc"/><text x="813" y="195" fill="#1e1b4b" font-size="12" font-weight="800" text-anchor="middle">5</text>
    <text x="831" y="195" fill="#f5f3ff" font-size="15" font-weight="700">Verify</text>
    <text x="858" y="218" fill="#f5d0fe" font-size="11.5" text-anchor="middle">a second agent with</text>
    <text x="858" y="233" fill="#f5d0fe" font-size="11.5" text-anchor="middle">fresh context checks</text>
    <text x="858" y="248" fill="#f5d0fe" font-size="11.5" text-anchor="middle">every claim</text>
  </g>

  <!-- rule nodes -->
  <g>
    <rect x="352" y="378" width="130" height="92" rx="14" fill="url(#ruleNode)" stroke="#60a5fa"/>
    <circle cx="372" cy="398" r="11" fill="#60a5fa"/><text x="372" y="403" fill="#0b1b3f" font-size="12" font-weight="800" text-anchor="middle">2</text>
    <text x="390" y="403" fill="#eff6ff" font-size="15" font-weight="700">Filter</text>
    <text x="417" y="432" fill="#bfdbfe" font-size="12" text-anchor="middle">query records by</text>
    <text x="417" y="449" fill="#bfdbfe" font-size="12" text-anchor="middle">structured fields</text>
  </g>
  <g>
    <rect x="940" y="378" width="130" height="92" rx="14" fill="url(#ruleNode)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)"/>
    <circle cx="960" cy="398" r="11" fill="#60a5fa"/><text x="960" y="403" fill="#0b1b3f" font-size="12" font-weight="800" text-anchor="middle">6</text>
    <text x="978" y="403" fill="#eff6ff" font-size="15" font-weight="700">Gate</text>
    <text x="1005" y="426" fill="#bfdbfe" font-size="11.5" text-anchor="middle">drops rejected claims</text>
    <text x="1005" y="441" fill="#bfdbfe" font-size="11.5" text-anchor="middle">checks every citation</text>
    <text x="1005" y="456" fill="#bfdbfe" font-size="11.5" text-anchor="middle">blocks "you should"</text>
  </g>

  <!-- data -->
  <g>
    <path d="M352,540 a65,12 0 0,1 130,0 v52 a65,12 0 0,1 -130,0 z" fill="#1f2937" stroke="#94a3b8"/>
    <ellipse cx="417" cy="540" rx="65" ry="12" fill="#334155" stroke="#94a3b8"/>
    <text x="417" y="575" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">Corpus</text>
    <text x="417" y="593" fill="#cbd5e1" font-size="11" text-anchor="middle">verified decision records</text>
  </g>
  <g>
    <rect x="940" y="530" width="130" height="62" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-dasharray="4 4"/>
    <text x="1005" y="556" fill="#eff6ff" font-size="14" font-weight="700" text-anchor="middle">Session log</text>
    <text x="1005" y="575" fill="#bfdbfe" font-size="11" text-anchor="middle">what was shown + verdicts</text>
  </g>

  <!-- footer -->
  <text x="640" y="632" fill="#e2e8f0" font-size="16" font-style="italic" text-anchor="middle">The LLM does the thinking. Plain code does the gatekeeping.</text>
</svg>
